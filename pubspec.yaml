name: zafra
description: "Juego de decisiones estilo Reigns/Lapse ambientado en una isla caribeña ficticia."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Estado / arquitectura
  flutter_riverpod: ^2.5.1

  # Persistencia local (progreso, finales vistos, configuración)
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  shared_preferences: ^2.2.3

  # Utilidades
  collection: ^1.18.0

  cupertino_icons: ^1.0.8
  audioplayers: ^6.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  mocktail: ^1.0.3
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true

  assets:
    - insp/
    - assets/cards/
    - assets/images/characters/
    - assets/images/characters/eventos/
    - assets/images/backgrounds/
    - assets/images/icons/
    - assets/images/logo/
    - assets/images/finals/
    - assets/music/

flutter_icons:
  android: true
  ios: true
  image_path: "assets/images/logo/icon card.png" # Ruta de tu imagen original
  adaptive_icon_background: "#121E16" # Color de fondo para Android adaptive
  adaptive_icon_foreground: "assets/images/logo/icon simply.png"

  # fonts:
  #   - family: Zafra
  #     fonts:
  #       - asset: assets/fonts/Zafra-Regular.ttf
