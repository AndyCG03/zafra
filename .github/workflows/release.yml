name: Build and Release Zafra

on:
  # Release builds are created only for semantic-version tags.
  push:
    tags:
      - 'v*.*.*'
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

env:
  FLUTTER_VERSION: '3.22.0'
  JAVA_VERSION: '17'

jobs:
  android:
    name: Android release artifacts
    runs-on: ubuntu-latest
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
          cache-key: flutter-${{ runner.os }}-${{ env.FLUTTER_VERSION }}
          pub-cache: true

      - name: Install dependencies
        run: |
          flutter --version
          flutter clean
          flutter pub get

      # Optional signing. Without these secrets, the project's configured
      # release signing (currently debug signing) remains in effect.
      - name: Configure release keystore
        if: ${{ env.ANDROID_KEYSTORE_BASE64 != '' }}
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/upload-keystore.jks
          cat > android/key.properties <<EOF
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyPassword=$ANDROID_KEY_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          storeFile=upload-keystore.jks
          EOF

      - name: Build split-per-ABI APKs
        run: flutter build apk --release --split-per-abi

      - name: Build Android App Bundle
        run: flutter build appbundle --release

      - name: Normalize and verify Android outputs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/android
          declare -A apk_arches=(
            [app-armeabi-v7a-release.apk]=app-armeabi-v7a-release.apk
            [app-arm64-v8a-release.apk]=app-arm64-v8a-release.apk
            [app-x86_64-release.apk]=app-x86_64-release.apk
          )
          for file in "${!apk_arches[@]}"; do
            source="build/app/outputs/flutter-apk/$file"
            test -f "$source"
            cp "$source" "dist/android/$file"
          done
          cp build/app/outputs/bundle/release/app-release.aab dist/android/app-release.aab
          test -f dist/android/app-release.aab
          test "$(find dist/android -name '*.apk' | wc -l)" -eq 3
          ls -lh dist/android

      - name: Upload Android workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: zafra-android-${{ github.ref_name }}
          path: dist/android/
          if-no-files-found: error
          retention-days: 30

  ios:
    name: iOS release build
    if: ${{ github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main' }}
    runs-on: macos-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
          pub-cache: true

      - name: Install dependencies
        run: |
          flutter clean
          flutter pub get

      # No Apple signing secrets are assumed. This produces an unsigned app
      # bundle suitable for CI validation; App Store signing can be added later.
      - name: Build unsigned iOS app
        run: flutter build ios --release --no-codesign

      - name: Upload iOS workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: zafra-ios-${{ github.ref_name }}
          path: build/ios/iphoneos/Runner.app
          if-no-files-found: error
          retention-days: 30

  web:
    name: Web release build
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
          pub-cache: true

      - name: Install dependencies and build web
        run: |
          flutter clean
          flutter pub get
          flutter build web --release

      - name: Upload web workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: zafra-web-${{ github.ref_name }}
          path: build/web/
          if-no-files-found: error
          retention-days: 30

  release:
    name: Create GitHub Release
    needs: [android]
    if: ${{ startsWith(github.ref, 'refs/tags/v') && needs.android.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download Android artifacts
        uses: actions/download-artifact@v4
        with:
          name: zafra-android-${{ github.ref_name }}
          path: release-assets

      - name: Verify release files
        shell: bash
        run: |
          set -euo pipefail
          for file in \
            release-assets/app-armeabi-v7a-release.apk \
            release-assets/app-arm64-v8a-release.apk \
            release-assets/app-x86_64-release.apk \
            release-assets/app-release.aab; do
            test -s "$file"
          done

      - name: Generate release notes from commits
        shell: bash
        run: |
          set -euo pipefail
          previous_tag=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || true)
          {
            echo "## Zafra $GITHUB_REF_NAME"
            echo
            if [ -n "$previous_tag" ]; then
              git log --pretty=format:'- %s (%h)' "$previous_tag..HEAD"
            else
              git log --pretty=format:'- %s (%h)' -n 30 HEAD
            fi
            echo
            echo
            echo "### Android artifacts"
            echo "- app-armeabi-v7a-release.apk"
            echo "- app-arm64-v8a-release.apk"
            echo "- app-x86_64-release.apk"
            echo "- app-release.aab"
          } > release-notes.md

      - name: Create GitHub Release and upload artifacts
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body_path: release-notes.md
          generate_release_notes: false
          files: release-assets/*
